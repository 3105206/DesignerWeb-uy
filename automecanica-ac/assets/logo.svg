<?xml version="1.0" encoding="UTF-8"?>
<!--
  Automecanica AC — logo redibujado a partir del logo original del cliente.
  Es una reconstrucción vectorial: mismas formas, mismos colores, pero la
  tipografía es la del sitio (Archivo), no la del archivo original.
  REEMPLAZAR por el archivo original del cliente cuando lo manden (ver PENDIENTES.md).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 30 900 294" width="900" height="294" role="img" aria-label="Automecanica AC">
  <title>Automecanica AC</title>

  <!-- Mancha amarilla pintada a mano, con el trazo abierto arriba a la izquierda -->
  <g fill="#EDE81C">
    <path d="M735 62c62 4 110 45 116 103 6 60-37 113-99 121-63 8-121-26-134-82-13-55 25-110 86-126 10-3 21-13 31-16z"/>
    <path d="M700 58c17-14 41-22 65-21 9 0 10 9 1 12-25 3-47 10-63 21-9 6-12-5-3-12z"/>
    <path d="M639 141c3-24 14-45 31-60 7-6 15 1 9 9-14 15-23 33-26 53-2 10-15 8-14-2z"/>
    <path d="M781 292c14-2 22 3 18 11-5 10-23 16-34 12-9-4-4-20 16-23z"/>
  </g>

  <!-- Cápsula azul marino -->
  <rect x="0" y="118" width="645" height="112" rx="56" fill="#152A6B"/>

  <!-- Wordmark -->
  <text x="52" y="203"
        font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="74" font-weight="700" font-style="italic"
        letter-spacing="-1.5" fill="#FFFFFF">Automecanica</text>

  <!-- AC: blanco con contorno azul, por encima de la cápsula y de la mancha -->
  <text x="596" y="252"
        font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="198" font-weight="700" font-style="italic"
        letter-spacing="-6" fill="#FFFFFF"
        stroke="#152A6B" stroke-width="11" stroke-linejoin="round"
        paint-order="stroke fill">AC</text>
</svg>
